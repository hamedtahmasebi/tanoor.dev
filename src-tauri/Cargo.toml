[package]
name = "ai-workflow-automation"
version = "0.1.0"
description = "A desktop workspace for automating and reviewing Codex tasks"
authors = ["AI Workflow Automation"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "ai_workflow_automation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
